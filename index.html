<style>
:root {
    --bg-dark: #050507;
    --red-primary: #ff1a40;
    --red-hover: #ff3355;
    --red-glow: rgba(255, 26, 64, 0.4);
    --card-bg: rgba(18, 10, 15, 0.55);
    --card-border: rgba(255, 26, 64, 0.25);
    --text-color: #ffffff;
    --text-muted: #a0a0a8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-color: var(--bg-dark);
    background: radial-gradient(circle at 50% 30%, #1a050a 0%, #050507 80%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text-color);
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background Canvas & Ambient Glows */
#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 1000px;
    height: 1000px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--red-glow), transparent 70%);
    filter: blur(120px);
    mix-blend-mode: screen;
    z-index: 1;
    animation: moveGlow 22s ease-in-out infinite alternate;
    pointer-events: none;
}

.glow-2 {
    position: fixed;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 0, 40, 0.3), transparent 65%);
    filter: blur(100px);
    z-index: 1;
    animation: moveGlow2 18s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes moveGlow {
    0% { transform: translate(-30%, -20%); }
    100% { transform: translate(20%, 20%); }
}

@keyframes moveGlow2 {
    0% { transform: translate(30%, 30%); }
    100% { transform: translate(-20%, -10%); }
}

/* Main Container */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Profile / Title Section */
.profile-title {
    font-size: 3.8rem;
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 26, 64, 0.6), 0 0 40px rgba(255, 26, 64, 0.2);
    margin-bottom: 6px;
}

.tagline {
    font-size: 0.95rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 35px;
    font-weight: 500;
}

.tagline span {
    color: var(--red-primary);
}

/* Social Links Grid */
.links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 25px;
}

.link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 1px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.link-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.link-card svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--red-primary);
    background: rgba(35, 12, 20, 0.85);
    box-shadow: 0 8px 25px rgba(255, 26, 64, 0.25);
}

.link-card:hover svg {
    color: var(--red-primary);
    transform: scale(1.15);
}

.link-arrow {
    font-size: 1.2rem;
    color: var(--text-muted);
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover .link-arrow {
    transform: translateX(5px);
    color: var(--red-primary);
}

/* Textbox Containers (Discord & Bank) */
.info-box-container {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 22px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    text-align: left;
    margin-bottom: 14px;
}

.info-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info-input-group {
    display: flex;
    gap: 10px;
}

.info-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 26, 64, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.info-input:focus {
    border-color: var(--red-primary);
    box-shadow: 0 0 10px var(--red-glow);
}

.copy-btn {
    background: var(--red-primary);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 0 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.copy-btn:hover {
    background: var(--red-hover);
    box-shadow: 0 0 15px var(--red-glow);
    transform: translateY(-1px);
}

.copy-btn:active {
    transform: translateY(0);
}

/* Toggle Console Button */
.console-toggle-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: rgba(15, 8, 12, 0.8);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-family: 'Fira Code', monospace;
    cursor: pointer;
    backdrop-filter: blur(10px);
    z-index: 100;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.console-toggle-btn:hover {
    color: #fff;
    border-color: var(--red-primary);
    box-shadow: 0 0 15px var(--red-glow);
}

/* Console Window */
.console {
    position: fixed;
    bottom: 80px;
    right: 25px;
    width: 360px;
    height: 250px;
    background: rgba(8, 4, 6, 0.92);
    border: 1px solid var(--red-primary);
    border-radius: 10px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 26, 64, 0.2);
    z-index: 999;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.console.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(15px) scale(0.95);
}

.console-header {
    padding: 10px 14px;
    background: rgba(255, 26, 64, 0.12);
    border-bottom: 1px solid rgba(255, 26, 64, 0.25);
    cursor: grab;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    color: var(--red-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Fira Code', monospace;
}

.console-header::after {
    content: "ESC to close";
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.4);
}

.console-header:active {
    cursor: grabbing;
}

.console-output {
    flex-grow: 1;
    overflow-y: auto;
    padding: 12px;
    font-size: 12px;
    font-family: 'Fira Code', monospace;
    color: #d0d0d0;
    line-height: 1.5;
}

.console-output div {
    margin-bottom: 4px;
}

.console input {
    width: 100%;
    padding: 10px 12px;
    border: none;
    outline: none;
    background: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    border-top: 1px solid rgba(255, 26, 64, 0.2);
}

.console input::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

/* Custom Scrollbar */
.console-output::-webkit-scrollbar {
    width: 5px;
}
.console-output::-webkit-scrollbar-track {
    background: transparent;
}
.console-output::-webkit-scrollbar-thumb {
    background: var(--red-primary);
    border-radius: 3px;
}

/* Mobile Responsiveness */
@media (max-width: 600px) {
    .profile-title {
        font-size: 2.8rem;
        letter-spacing: 6px;
    }
    .link-card {
        padding: 14px 18px;
    }
    .console {
        width: 90%;
        right: 5%;
        left: 5%;
        bottom: 80px;
    }
}
</style>
</head>

<script>
/* ===== CRIMSON RIBBON / WAVE CANVAS ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;

function animate() {
    ctx.clearRect(0, 0, width, height);
    time += 0.0035;

    // Glowing Red/Crimson Waves
    const waves = [
        { amplitude: 130, frequency: 0.001, speed: 1.4, color: "rgba(255, 26, 64, 0.03)", glow: "rgba(255, 26, 64, 0.25)", offset: 0 },
        { amplitude: 170, frequency: 0.0012, speed: 1.1, color: "rgba(180, 0, 40, 0.02)", glow: "rgba(255, 50, 80, 0.15)", offset: Math.PI },
        { amplitude: 90, frequency: 0.0018, speed: 1.8, color: "rgba(255, 26, 64, 0.02)", glow: "rgba(255, 26, 64, 0.1)", offset: Math.PI / 2 }
    ];

    waves.forEach((w, index) => {
        ctx.beginPath();
        ctx.moveTo(-50, height / 2);

        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }

        ctx.lineTo(width + 50, height + 50);
        ctx.lineTo(-50, height + 50);
        ctx.closePath();

        ctx.fillStyle = w.color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-50, height / 2);
        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = w.glow;
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== CONSOLE LOGIC ===== */
const consoleBox = document.getElementById("console");
const input = document.getElementById("consoleInput");
const output = document.getElementById("consoleOutput");
const header = document.getElementById("consoleHeader");
const toggleConsoleBtn = document.getElementById("toggleConsoleBtn");

function toggleConsole() {
    consoleBox.classList.toggle("hidden");
    if (!consoleBox.classList.contains("hidden")) {
        input.focus();
    }
}

toggleConsoleBtn.addEventListener("click", toggleConsole);

window.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        toggleConsole();
    }

    if (e.key === "Escape" && !consoleBox.classList.contains("hidden")) {
        consoleBox.classList.add("hidden");
        input.blur();
    }
});

function log(msg, color = "#d0d0d0") {
    output.innerHTML += `<div style="color: ${color};">&gt; ${msg}</div>`;
    output.scrollTop = output.scrollHeight;
}

input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;

    const cmd = input.value.trim();
    input.value = "";

    if (!cmd) return;

    log(cmd, "#888");

    if (cmd === "/time") log(new Date().toLocaleTimeString());
    else if (cmd === "/name") log("My name is Alex");
    else if (cmd === "/mail") log("Contact me: itzmrolas@outlook.com");
    else if (cmd === "/chess") {
        window.open("https://www.chess.com", "_blank");
        log("Opening Chess.com...", "#ff1a40");
    }
    else if (cmd === "/rythm game" || cmd === "/rythm") {
        window.open("https://itzmrolas.github.io/playarythmgame/", "_blank");
        log("Opening Rythm Game...", "#ff1a40");
    }
    else if (cmd === "/clear") {
        output.innerHTML = "";
    }
    else if (cmd === "/help") {
        log("Available Commands:");
        log("  /time  - Shows current time");
        log("  /name  - Displays my name");
        log("  /mail  - Displays my contact email");
        log("  /chess - Opens chess.com");
        log("  /rythm - Opens my rythm game");
        log("  /open [platform] - Opens specified social link");
        log("  /clear - Clears the console");
    }
    else if (cmd.startsWith("/open")) {
        const arg = cmd.split(" ")[1];

        const links = {
            yt: "https://www.youtube.com/@itzmrolas",
            youtube: "https://www.youtube.com/@itzmrolas",
            tiktok: "https://www.tiktok.com/@itzmrolas",
            insta: "https://www.instagram.com/itzmrolas",
            instagram: "https://www.instagram.com/itzmrolas",
            spotify: "https://open.spotify.com/user/31lk4chceqkrc6xcaa2kurtlyfbm",
            discord: "https://discord.gg/6nPEVJkJmH",
            paypal: "https://paypal.me/itzmrolas"
        };

        if (links[arg]) {
            window.open(links[arg], "_blank");
            log(`Opening ${arg}...`, "#ff1a40");
        } else {
            log("Unknown platform. Options: yt, tiktok, insta, spotify, discord, paypal", "#ff4d4d");
        }
    }
    else {
        log("Unknown command. Type /help for options.", "#ff4d4d");
    }
});

/* ===== DRAG CONSOLE ===== */
let dragging = false;
let offsetX = 0;
let offsetY = 0;

header.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - consoleBox.offsetLeft;
    offsetY = e.clientY - consoleBox.offsetTop;
    document.body.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    let newLeft = e.clientX - offsetX;
    let newTop = e.clientY - offsetY;
    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - consoleBox.offsetWidth));
    newTop = Math.max(0, Math.min(newTop, window.innerHeight - consoleBox.offsetHeight));
    consoleBox.style.left = newLeft + "px";
    consoleBox.style.top = newTop + "px";
});

document.addEventListener("mouseup", () => {
    if (dragging) {
        dragging = false;
        document.body.style.cursor = "default";
    }
});
