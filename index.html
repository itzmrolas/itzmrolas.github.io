<link rel="icon" type="image/png" href="favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #050507;
    --red-primary: #ff1a40;
    --red-hover: #ff3355;
    --red-glow: rgba(255, 26, 64, 0.4);
    --card-bg: rgba(18, 10, 15, 0.55);
    --card-border: rgba(255, 26, 64, 0.25);
    --text-color: #ffffff;
    --text-muted: #a0a0a8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-color: var(--bg-dark);
    background: radial-gradient(circle at 50% 30%, #1a050a 0%, #050507 80%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text-color);
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background Canvas & Ambient Glows */
#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 1000px;
    height: 1000px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--red-glow), transparent 70%);
    filter: blur(120px);
    mix-blend-mode: screen;
    z-index: 1;
    animation: moveGlow 22s ease-in-out infinite alternate;
    pointer-events: none;
}

.glow-2 {
    position: fixed;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 0, 40, 0.3), transparent 65%);
    filter: blur(100px);
    z-index: 1;
    animation: moveGlow2 18s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes moveGlow {
    0% { transform: translate(-30%, -20%); }
    100% { transform: translate(20%, 20%); }
}

@keyframes moveGlow2 {
    0% { transform: translate(30%, 30%); }
    100% { transform: translate(-20%, -10%); }
}

/* Top Right Auth Container & Menu */
.auth-top-right {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
}

.auth-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 30px;
    background: var(--card-bg);
    border: 1px solid rgba(66, 133, 244, 0.4);
    color: white;
    font-weight: 600;
    font-size: 0.85rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

.auth-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

.auth-btn img.user-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
}

.auth-btn:hover {
    border-color: #4285F4;
    background: rgba(18, 25, 40, 0.85);
    box-shadow: 0 0 15px rgba(66, 133, 244, 0.4);
    transform: translateY(-2px);
}

/* Account Dropdown Menu */
.account-menu {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: 270px;
    background: rgba(12, 6, 10, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 26, 64, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.account-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.menu-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--red-primary);
    box-shadow: 0 0 12px var(--red-glow);
}

.menu-info {
    width: 100%;
    overflow: hidden;
}

.menu-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.menu-email {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'Fira Code', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 4px;
}

.menu-logout-btn {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: rgba(255, 26, 64, 0.1);
    color: var(--red-primary);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
}

.menu-logout-btn:hover {
    background: var(--red-primary);
    color: white;
    box-shadow: 0 0 15px var(--red-glow);
}

/* Main Container */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Profile / Title Section */
.profile-title {
    font-size: 3.8rem;
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 26, 64, 0.6), 0 0 40px rgba(255, 26, 64, 0.2);
    margin-bottom: 6px;
}

.tagline {
    font-size: 0.95rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 35px;
    font-weight: 500;
}

.tagline span {
    color: var(--red-primary);
}

/* Social Links Grid */
.links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 25px;
}

.link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 1px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    cursor: pointer;
}

.link-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.link-card svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--red-primary);
    background: rgba(35, 12, 20, 0.85);
    box-shadow: 0 8px 25px rgba(255, 26, 64, 0.25);
}

.link-card:hover svg {
    color: var(--red-primary);
    transform: scale(1.15);
}

.link-arrow {
    font-size: 1.2rem;
    color: var(--text-muted);
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover .link-arrow {
    transform: translateX(5px);
    color: var(--red-primary);
}

/* Textbox Containers */
.info-box-container {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 22px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    text-align: left;
    margin-bottom: 14px;
}

.info-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info-input-group {
    display: flex;
    gap: 10px;
}

.info-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 26, 64, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.info-input:focus {
    border-color: var(--red-primary);
    box-shadow: 0 0 10px var(--red-glow);
}

.copy-btn {
    background: var(--red-primary);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 0 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.copy-btn:hover {
    background: var(--red-hover);
    box-shadow: 0 0 15px var(--red-glow);
    transform: translateY(-1px);
}

/* Console Toggle Button */
.console-toggle-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: rgba(15, 8, 12, 0.8);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-family: 'Fira Code', monospace;
    cursor: pointer;
    backdrop-filter: blur(10px);
    z-index: 100;
    transition: all 0.3s ease;
}

.console-toggle-btn:hover {
    color: #fff;
    border-color: var(--red-primary);
    box-shadow: 0 0 15px var(--red-glow);
}

/* Console Window */
.console {
    position: fixed;
    bottom: 80px;
    right: 25px;
    width: 360px;
    height: 250px;
    background: rgba(8, 4, 6, 0.92);
    border: 1px solid var(--red-primary);
    border-radius: 10px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 26, 64, 0.2);
    z-index: 999;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.console.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(15px) scale(0.95);
}

.console-header {
    padding: 10px 14px;
    background: rgba(255, 26, 64, 0.12);
    border-bottom: 1px solid rgba(255, 26, 64, 0.25);
    cursor: grab;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    color: var(--red-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Fira Code', monospace;
}

.console-output {
    flex-grow: 1;
    overflow-y: auto;
    padding: 12px;
    font-size: 12px;
    font-family: 'Fira Code', monospace;
    color: #d0d0d0;
    line-height: 1.5;
}

.console input {
    width: 100%;
    padding: 10px 12px;
    border: none;
    outline: none;
    background: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    border-top: 1px solid rgba(255, 26, 64, 0.2);
}

@media (max-width: 600px) {
    .auth-top-right {
        top: 15px;
        right: 15px;
    }
    .profile-title {
        font-size: 2.8rem;
        letter-spacing: 6px;
    }
}
</style>
</head>

    <input id="consoleInput" placeholder="Type command..." autocomplete="off" spellcheck="false" />

<script>
/* ===== CANVAS BACKGROUND ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;
function animate() {
    ctx.clearRect(0, 0, width, height);
    time += 0.0035;

    const waves = [
        { amplitude: 130, frequency: 0.001, speed: 1.4, color: "rgba(255, 26, 64, 0.03)", glow: "rgba(255, 26, 64, 0.25)", offset: 0 },
        { amplitude: 170, frequency: 0.0012, speed: 1.1, color: "rgba(180, 0, 40, 0.02)", glow: "rgba(255, 50, 80, 0.15)", offset: Math.PI },
        { amplitude: 90, frequency: 0.0018, speed: 1.8, color: "rgba(255, 26, 64, 0.02)", glow: "rgba(255, 26, 64, 0.1)", offset: Math.PI / 2 }
    ];

    waves.forEach((w) => {
        ctx.beginPath();
        ctx.moveTo(-50, height / 2);
        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(width + 50, height + 50);
        ctx.lineTo(-50, height + 50);
        ctx.closePath();
        ctx.fillStyle = w.color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-50, height / 2);
        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = w.glow;
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== COPY DISCORD ===== */
document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("discordUsername").value).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.innerText = "Copied!";
        btn.style.background = "#28a745";
        setTimeout(() => { btn.innerText = "Copy"; btn.style.background = "var(--red-primary)"; }, 2000);
    });
});

/* ===== COPY BANK ===== */
document.getElementById("copyBankBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("bankAccount").value).then(() => {
        const btn = document.getElementById("copyBankBtn");
        btn.innerText = "Copied!";
        btn.style.background = "#28a745";
        setTimeout(() => { btn.innerText = "Copy"; btn.style.background = "var(--red-primary)"; }, 2000);
    });
});

/* ===== CONSOLE LOGIC ===== */
const consoleBox = document.getElementById("console");
const input = document.getElementById("consoleInput");
const output = document.getElementById("consoleOutput");

document.getElementById("toggleConsoleBtn").addEventListener("click", () => {
    consoleBox.classList.toggle("hidden");
    if (!consoleBox.classList.contains("hidden")) input.focus();
});

window.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        consoleBox.classList.remove("hidden");
        input.focus();
    }
    if (e.key === "Escape" && !consoleBox.classList.contains("hidden")) {
        consoleBox.classList.add("hidden");
        input.blur();
    }
});

function log(msg, color = "#d0d0d0") {
    output.innerHTML += `<div style="color: ${color};">&gt; ${msg}</div>`;
    output.scrollTop = output.scrollHeight;
}

input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const cmd = input.value.trim();
    input.value = "";
    if (!cmd) return;

    log(cmd, "#888");
    if (cmd === "/time") log(new Date().toLocaleTimeString());
    else if (cmd === "/name") log("My name is Alex");
    else if (cmd === "/mail") log("Contact me: itzmrolas@outlook.com");
    else if (cmd === "/clear") output.innerHTML = "";
    else if (cmd === "/help") {
        log("Commands: /time, /name, /mail, /clear");
    } else {
        log("Unknown command. Type /help", "#ff4d4d");
    }
});
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, signOut, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPbCa9zMydqY3Y5jC6uOMmKpiE5nc2OYg",
      authDomain: "itzmrolas.firebaseapp.com",
      projectId: "itzmrolas",
      storageBucket: "itzmrolas.firebasestorage.app",
      messagingSenderId: "505439889223",
      appId: "1:505439889223:web:85184795f89b7a23084e62"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginIcon = document.getElementById('loginIcon');
    
    const accountMenu = document.getElementById('accountMenu');
    const menuAvatar = document.getElementById('menuAvatar');
    const menuName = document.getElementById('menuName');
    const menuEmail = document.getElementById('menuEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    const defaultGoogleSvg = `<svg viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>`;

    // Track authentication state changes
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const firstName = user.displayName ? user.displayName.split(' ')[0] : 'User';
        const photoUrl = user.photoURL || 'https://via.placeholder.com/150';

        loginText.innerText = firstName;
        loginIcon.innerHTML = `<img src="${photoUrl}" class="user-avatar" alt="User">`;

        // Populate dropdown card details
        menuName.innerText = user.displayName || 'No Name Provided';
        menuEmail.innerText = user.email || 'No Email Provided';
        menuAvatar.src = photoUrl;
      } else {
        loginText.innerText = "Sign In";
        loginIcon.innerHTML = defaultGoogleSvg;
        accountMenu.classList.remove('active');
      }
    });

    // Top Right Button Click
    loginBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (auth.currentUser) {
        // Toggle Dropdown Menu
        accountMenu.classList.toggle('active');
      } else {
        // Trigger Google Login
        signInWithPopup(auth, provider).catch((error) => {
          console.error("Auth Error:", error);
          alert(`Login Failed!\n\nReason: ${error.code}`);
        });
      }
    });

    // Logout Action Inside Dropdown
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        accountMenu.classList.remove('active');
      }).catch((err) => console.error(err));
    });

    // Close menu when clicking outside
    window.addEventListener('click', (e) => {
      if (!accountMenu.contains(e.target) && !loginBtn.contains(e.target)) {
        accountMenu.classList.remove('active');
      }
    });
</script>
