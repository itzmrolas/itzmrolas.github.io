<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itzmrolas Network</title>

<!-- Website Icon (Favicon) -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #070b12;
    --blue-primary: #0088ff;
    --blue-hover: #1a94ff;
    --blue-glow: rgba(0, 136, 255, 0.4);
    --card-bg: rgba(10, 20, 35, 0.65);
    --card-border: rgba(0, 136, 255, 0.3);
    --text-color: #ffffff;
    --text-muted: #a0b0c8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-color: var(--bg-dark);
    background: radial-gradient(circle at 50% 30%, #0a182b 0%, #05080e 80%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text-color);
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background Canvas & Ambient Glows */
#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 1000px;
    height: 1000px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--blue-glow), transparent 70%);
    filter: blur(120px);
    mix-blend-mode: screen;
    z-index: 1;
    animation: moveGlow 22s ease-in-out infinite alternate;
    pointer-events: none;
}

.glow-2 {
    position: fixed;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 80, 180, 0.3), transparent 65%);
    filter: blur(100px);
    z-index: 1;
    animation: moveGlow2 18s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes moveGlow {
    0% { transform: translate(-30%, -20%); }
    100% { transform: translate(20%, 20%); }
}

@keyframes moveGlow2 {
    0% { transform: translate(30%, 30%); }
    100% { transform: translate(-20%, -10%); }
}

/* Main Container */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Authentic Aternos Logo Styling */
.aternos-logo {
    width: 90px;
    height: auto;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 16px var(--blue-glow));
}

/* Profile / Title Section */
.profile-title {
    font-size: 3.8rem;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 136, 255, 0.6), 0 0 40px rgba(0, 136, 255, 0.2);
    margin-bottom: 6px;
}

.tagline {
    font-size: 0.95rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 35px;
    font-weight: 500;
}

/* Textbox Containers */
.info-box-container {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 22px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    text-align: left;
    margin-bottom: 14px;
}

.info-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--blue-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info-input-group {
    display: flex;
    gap: 10px;
}

.info-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 136, 255, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.info-input:focus {
    border-color: var(--blue-primary);
    box-shadow: 0 0 10px var(--blue-glow);
}

.copy-btn, .action-btn {
    background: var(--blue-primary);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 0 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
}

.copy-btn:hover, .action-btn:hover {
    background: var(--blue-hover);
    box-shadow: 0 0 15px var(--blue-glow);
    transform: translateY(-1px);
}

.copy-btn:active, .action-btn:active {
    transform: translateY(0);
}

.sub-note {
    font-size: 0.75rem;
    color: var(--blue-primary);
    margin-top: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* Mobile Responsiveness */
@media (max-width: 600px) {
    .profile-title {
        font-size: 2.3rem;
        letter-spacing: 3px;
    }
    .aternos-logo {
        width: 70px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="glow"></div>
<div class="glow-2"></div>

<div class="content">
    <!-- Official Aternos SVG Icon Logo -->
    <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/aternos/default.svg" alt="Aternos Logo" class="aternos-logo" />

    <h1 class="profile-title">ITZMROLAS NETWORK</h1>
    <p class="tagline">Official Minecraft Server & Info</p>

    <!-- Server IP Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M4 1h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zM6 3v2h2V3H6zm0 8v2h2v-2H6zm0 8v2h2v-2H6z"/></svg>
            <span>Minecraft Server IP</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" id="serverIp" value="itzmrolas.aternos.me" readonly />
            <button class="copy-btn" id="copyIpBtn">Copy</button>
        </div>
    </div>

    <!-- Discord Username Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Discord Username</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" id="discordUsername" value="itzmrolas" readonly />
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <div class="sub-note">DM ME YOUR USERNAME FOR WHITELIST</div>
    </div>

    <!-- Discord Server Link Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/></svg>
            <span>Discord Server</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" value="https://discord.gg/6nPEVJkJmH" readonly />
            <a href="https://discord.gg/6nPEVJkJmH" target="_blank" rel="noopener noreferrer" class="action-btn">Join</a>
        </div>
    </div>
</div>

<script>
/* ===== BLUE RIBBON / WAVE CANVAS ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;

function animate() {
    ctx.clearRect(0, 0, width, height);
    time += 0.0035;

    // Glowing Aternos-Blue Waves
    const waves = [
        { amplitude: 130, frequency: 0.001, speed: 1.4, color: "rgba(0, 136, 255, 0.03)", glow: "rgba(0, 136, 255, 0.25)", offset: 0 },
        { amplitude: 170, frequency: 0.0012, speed: 1.1, color: "rgba(0, 80, 180, 0.02)", glow: "rgba(30, 150, 255, 0.15)", offset: Math.PI },
        { amplitude: 90, frequency: 0.0018, speed: 1.8, color: "rgba(0, 136, 255, 0.02)", glow: "rgba(0, 136, 255, 0.1)", offset: Math.PI / 2 }
    ];

    waves.forEach((w) => {
        ctx.beginPath();
        ctx.moveTo(-50, height / 2);

        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }

        ctx.lineTo(width + 50, height + 50);
        ctx.lineTo(-50, height + 50);
        ctx.closePath();

        ctx.fillStyle = w.color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-50, height / 2);
        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = w.glow;
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== COPY SERVER IP ===== */
const copyIpBtn = document.getElementById("copyIpBtn");
const serverIpInput = document.getElementById("serverIp");

copyIpBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(serverIpInput.value).then(() => {
        copyIpBtn.innerText = "Copied!";
        copyIpBtn.style.background = "#28a745";
        setTimeout(() => {
            copyIpBtn.innerText = "Copy";
            copyIpBtn.style.background = "var(--blue-primary)";
        }, 2000);
    });
});

/* ===== COPY DISCORD USERNAME ===== */
const copyBtn = document.getElementById("copyBtn");
const discordInput = document.getElementById("discordUsername");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(discordInput.value).then(() => {
        copyBtn.innerText = "Copied!";
        copyBtn.style.background = "#28a745";
        setTimeout(() => {
            copyBtn.innerText = "Copy";
            copyBtn.style.background = "var(--blue-primary)";
        }, 2000);
    });
});
</script>

</body>
</html>
