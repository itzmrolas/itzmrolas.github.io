<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuzyniakowo</title>

<!-- Website Icon (Favicon) -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #070603;
    --gold-primary: #ffd700;
    --gold-hover: #ffae00;
    --gold-glow: rgba(255, 215, 0, 0.35);
    --card-bg: rgba(20, 17, 10, 0.65);
    --card-border: rgba(255, 215, 0, 0.25);
    --text-color: #ffffff;
    --text-muted: #b8b09d;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-color: var(--bg-dark);
    background: radial-gradient(circle at 50% 30%, #1a1505 0%, #070603 80%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text-color);
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background Canvas & Ambient Glows */
#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 1000px;
    height: 1000px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-glow), transparent 70%);
    filter: blur(120px);
    mix-blend-mode: screen;
    z-index: 1;
    animation: moveGlow 22s ease-in-out infinite alternate;
    pointer-events: none;
}

.glow-2 {
    position: fixed;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 130, 0, 0.25), transparent 65%);
    filter: blur(100px);
    z-index: 1;
    animation: moveGlow2 18s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes moveGlow {
    0% { transform: translate(-30%, -20%); }
    100% { transform: translate(20%, 20%); }
}

@keyframes moveGlow2 {
    0% { transform: translate(30%, 30%); }
    100% { transform: translate(-20%, -10%); }
}

/* Language Switcher Button */
.lang-switch-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--gold-primary);
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.lang-switch-btn:hover {
    background: rgba(40, 32, 12, 0.9);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
    transform: translateY(-2px);
}

/* Main Container */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    padding: 60px 20px 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Profile / Title Section */
.profile-title {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.2);
    margin-bottom: 6px;
}

.tagline {
    font-size: 0.95rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 35px;
    font-weight: 500;
}

.tagline span {
    color: var(--gold-primary);
}

/* Social Links Grid */
.links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 25px;
}

.link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 1px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.link-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.link-card svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--gold-primary);
    background: rgba(35, 28, 12, 0.85);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.25);
}

.link-card:hover svg {
    color: var(--gold-primary);
    transform: scale(1.15);
}

.link-arrow {
    font-size: 1.2rem;
    color: var(--text-muted);
    transition: transform 0.3s ease, color 0.3s ease;
}

.link-card:hover .link-arrow {
    transform: translateX(5px);
    color: var(--gold-primary);
}

/* Textbox Containers */
.info-box-container {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 22px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    text-align: left;
    margin-bottom: 14px;
}

.info-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info-input-group {
    display: flex;
    gap: 10px;
}

.info-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: #ffffff;
    font-family: 'Fira Code', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.info-input:focus {
    border-color: var(--gold-primary);
    box-shadow: 0 0 10px var(--gold-glow);
}

.copy-btn {
    background: var(--gold-primary);
    border: none;
    border-radius: 8px;
    color: #000;
    padding: 0 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.copy-btn:hover {
    background: var(--gold-hover);
    box-shadow: 0 0 15px var(--gold-glow);
    transform: translateY(-1px);
}

.copy-btn:active {
    transform: translateY(0);
}

/* Mobile Responsiveness */
@media (max-width: 600px) {
    .profile-title {
        font-size: 2.5rem;
        letter-spacing: 4px;
    }
    .link-card {
        padding: 14px 18px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="glow"></div>
<div class="glow-2"></div>

<!-- PL/ENG Language Toggle Button -->
<button class="lang-switch-btn" id="langToggleBtn">
    🌐 <span id="langBtnText">ENG</span>
</button>

<div class="content">
    <h1 class="profile-title">KUZYNIAKOWO</h1>
    <p class="tagline" id="taglineText">Oficjalny <span>Serwer Minecraft</span> & Społeczność</p>

    <!-- Server IP Textbox Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 4v4h16V6H4zm0 6v6h16v-6H4zm2 1h2v4H6v-4zm0-6h2v2H6V7z"/></svg>
            <span id="labelServerIp">Adres IP Serwera</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" id="serverIp" value="kuzyniakowo.minecraft.party" readonly />
            <button class="copy-btn copy-action" data-target="serverIp" id="copyIpBtn">Kopiuj</button>
        </div>
    </div>

    <div class="links">
        <!-- Discord Server Link -->
        <a class="link-card" href="https://discord.gg/6nPEVJkJmH" target="_blank" rel="noopener noreferrer">
            <div class="link-left">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                <span id="linkDiscord">Serwer Discord</span>
            </div>
            <span class="link-arrow">&#x276F;</span>
        </a>

        <!-- Support / PayPal -->
        <a class="link-card" href="https://paypal.me/itzmrolas" target="_blank" rel="noopener noreferrer">
            <div class="link-left">
                <svg viewBox="0 0 24 24"><path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944 3.72a.77.77 0 0 1 .761-.65h6.398c2.906 0 5.105.748 5.86 2.083.69 1.22.427 2.923-.621 4.296-1.127 1.474-3.003 2.302-5.426 2.302H9.255a.641.641 0 0 0-.633.54l-.87 5.518-.016.103-.66 4.185a.641.641 0 0 1-.633.54h-.367zm12.37-13.43c-.443-.781-1.428-1.258-2.768-1.335h-5.01l-2.09 13.25h1.868a.641.641 0 0 0 .633-.54l.87-5.518a.77.77 0 0 1 .761-.65h1.232c3.55 0 6.136-1.393 6.942-3.87.327-1.006.185-1.921-.438-2.337z"/></svg>
                <span id="linkPaypal">Wsparcie (PayPal)</span>
            </div>
            <span class="link-arrow">&#x276F;</span>
        </a>
    </div>

    <!-- Email Textbox Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span id="labelEmail">Kontakt Email</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" id="emailAddress" value="aleksanderswigost@gmail.com" readonly />
            <button class="copy-btn copy-action" data-target="emailAddress" id="copyEmailBtn">Kopiuj</button>
        </div>
    </div>

    <!-- Bank Account Section -->
    <div class="info-box-container">
        <div class="info-label">
            <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M4 10h2v7H4zm6 0h2v7h-2zm6 0h2v7h-2zM2 22h20v-3H2v3zm10-20L2 6v2h20V6l-10-4z"/></svg>
            <span id="labelBank">Przelew Bankowy (PLN)</span>
        </div>
        <div class="info-input-group">
            <input type="text" class="info-input" id="bankAccount" value="26 1050 1445 1000 0098 5161 0189" readonly />
            <button class="copy-btn copy-action" data-target="bankAccount" id="copyBankBtn">Kopiuj</button>
        </div>
    </div>
</div>

<script>
/* ===== GOLD WAVE / RIBBON CANVAS ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;

function animate() {
    ctx.clearRect(0, 0, width, height);
    time += 0.0035;

    // Glowing Golden Waves
    const waves = [
        { amplitude: 130, frequency: 0.001, speed: 1.4, color: "rgba(255, 215, 0, 0.03)", glow: "rgba(255, 215, 0, 0.25)", offset: 0 },
        { amplitude: 170, frequency: 0.0012, speed: 1.1, color: "rgba(180, 130, 0, 0.02)", glow: "rgba(255, 180, 0, 0.15)", offset: Math.PI },
        { amplitude: 90, frequency: 0.0018, speed: 1.8, color: "rgba(255, 215, 0, 0.02)", glow: "rgba(255, 215, 0, 0.1)", offset: Math.PI / 2 }
    ];

    waves.forEach((w) => {
        ctx.beginPath();
        ctx.moveTo(-50, height / 2);

        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }

        ctx.lineTo(width + 50, height + 50);
        ctx.lineTo(-50, height + 50);
        ctx.closePath();

        ctx.fillStyle = w.color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-50, height / 2);
        for (let x = -50; x <= width + 50; x += 25) {
            let y = height / 2 
                + Math.sin(x * w.frequency + time * w.speed + w.offset) * w.amplitude
                + Math.cos(x * w.frequency * 0.5 - time) * 45;
            ctx.lineTo(x, y);
        }
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = w.glow;
        ctx.stroke();
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== TRANSLATION DICTIONARY & SWITCHER ===== */
let currentLang = "PL";

const translations = {
    PL: {
        tagline: 'Oficjalny <span>Serwer Minecraft</span> & Społeczność',
        labelServerIp: 'Adres IP Serwera',
        linkDiscord: 'Serwer Discord',
        linkPaypal: 'Wsparcie (PayPal)',
        labelEmail: 'Kontakt Email',
        labelBank: 'Przelew Bankowy (PLN)',
        copyBtn: 'Kopiuj',
        copiedBtn: 'Skopiowano!',
        langBtn: 'ENG'
    },
    ENG: {
        tagline: 'Official <span>Minecraft Server</span> & Community',
        labelServerIp: 'Server IP Address',
        linkDiscord: 'Discord Server',
        linkPaypal: 'Support (PayPal)',
        labelEmail: 'Contact Email',
        labelBank: 'Bank Transfer (PLN)',
        copyBtn: 'Copy',
        copiedBtn: 'Copied!',
        langBtn: 'PL'
    }
};

const langToggleBtn = document.getElementById("langToggleBtn");
const langBtnText = document.getElementById("langBtnText");

function updateLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];

    document.getElementById("taglineText").innerHTML = t.tagline;
    document.getElementById("labelServerIp").innerText = t.labelServerIp;
    document.getElementById("linkDiscord").innerText = t.linkDiscord;
    document.getElementById("linkPaypal").innerText = t.linkPaypal;
    document.getElementById("labelEmail").innerText = t.labelEmail;
    document.getElementById("labelBank").innerText = t.labelBank;
    langBtnText.innerText = t.langBtn;

    document.querySelectorAll(".copy-action").forEach(btn => {
        if (btn.dataset.copied !== "true") {
            btn.innerText = t.copyBtn;
        }
    });
}

langToggleBtn.addEventListener("click", () => {
    const newLang = currentLang === "PL" ? "ENG" : "PL";
    updateLanguage(newLang);
});

/* ===== COPY TO CLIPBOARD HANDLERS ===== */
document.querySelectorAll(".copy-action").forEach(btn => {
    btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const inputEl = document.getElementById(targetId);
        
        navigator.clipboard.writeText(inputEl.value).then(() => {
            btn.innerText = translations[currentLang].copiedBtn;
            btn.style.background = "#28a745";
            btn.style.color = "#ffffff";
            btn.dataset.copied = "true";

            setTimeout(() => {
                btn.innerText = translations[currentLang].copyBtn;
                btn.style.background = "var(--gold-primary)";
                btn.style.color = "#000000";
                btn.dataset.copied = "false";
            }, 2000);
        }).catch(err => {
            console.error("Failed to copy text: ", err);
        });
    });
});
</script>

</body>
</html>
